# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds gittype for the Asciiverse catalog: one archive per target,
# named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v0.10.4-av.1. Linux builds run in Alpine, so the binaries
# are static (musl; libgit2, OpenSSL and SQLite are vendored and built in).
# Windows builds use MSVC on Windows runners. Every archive carries
# asciiverse/samples as samples/ beside the binary: av starts titles in
# their install folder, and that is the code gittype finds there. Built
# with GITTYPE_NO_UPDATE_CHECK, since av brings the updates.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: gittype
  BIN: gittype
  GITTYPE_NO_UPDATE_CHECK: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src -e GITTYPE_NO_UPDATE_CHECK rust:1-alpine sh -c '
            apk add --no-cache musl-dev perl make cmake g++ linux-headers &&
            cargo build --release --locked &&
            strip target/release/gittype'
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/$BIN

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/release/$BIN LICENSE README.md PATCHES.md stage/ && cp -r asciiverse/samples stage/samples
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .


      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/$BIN
          file target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN LICENSE README.md PATCHES.md stage/ && cp -r asciiverse/samples stage/samples
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN.exe LICENSE README.md PATCHES.md stage/ && cp -r asciiverse/samples stage/samples
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "gittype $TAG" \
                 --notes "gittype by Yuji Ueki and contributors (github.com/unhappychoice/gittype), built for the Asciiverse catalog: one binary for Linux, macOS and Windows, with code from catalog games to type in samples/. MIT. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
